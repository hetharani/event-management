<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Event Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1b2430; --paper:#f3f1ea; --card:#ffffff; --line:#e2ddd0;
  --accent:#1f6f5c; --accent2:#2f8f77; --accent-soft:#e4efe9;
  --warn:#c0392b; --muted:#736b5c;
  --radius:10px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#eae6dc; --paper:#15130f; --card:#1e1c17; --line:#332f26;
    --accent:#4fb493; --accent2:#5fcf9f; --accent-soft:#1f2e27; --muted:#a39c8c;
  }
}
:root[data-theme="dark"]{
  --ink:#eae6dc; --paper:#15130f; --card:#1e1c17; --line:#332f26;
  --accent:#4fb493; --accent2:#5fcf9f; --accent-soft:#1f2e27; --muted:#a39c8c;
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  line-height:1.5;
}
.wrap{max-width:800px;margin:0 auto;padding:40px 22px 70px;}

.hero{
  background:linear-gradient(135deg,var(--accent) 0%,var(--accent2) 100%);
  border-radius:16px; padding:26px 28px; color:#fff; margin-bottom:26px;
  box-shadow:0 10px 30px -12px rgba(31,111,92,0.45);
}
h1{font-family:'Poppins',sans-serif;font-size:1.7rem;font-weight:700;margin:0 0 4px;letter-spacing:-0.01em;}
.sub{color:rgba(255,255,255,0.85);font-size:0.92rem;margin:0;}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;}
.toolbar input[type=text], .toolbar select{
  border:1px solid var(--line); background:var(--card); color:var(--ink);
  border-radius:8px; padding:10px 12px; font-size:0.9rem; font-family:inherit;
}
.toolbar input[type=text]{flex:1;min-width:160px;}
.btn{
  border:none; background:var(--accent); color:#fff;
  border-radius:8px; padding:10px 18px; font-size:0.9rem; font-weight:600;
  cursor:pointer; box-shadow:0 4px 12px -4px rgba(31,111,92,0.55);
  transition:transform 0.12s ease, filter 0.12s ease;
  font-family:inherit;
}
.btn:hover{filter:brightness(1.07);transform:translateY(-1px);}
.btn:active{transform:translateY(0);}
.btn.ghost{background:transparent;color:var(--accent);box-shadow:none;border:1px solid var(--line);}
.btn.small{padding:6px 12px;font-size:0.8rem;}
.btn.danger{background:transparent;color:var(--warn);border:1px solid var(--warn);box-shadow:none;}

form.event-form{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:20px;
  margin-bottom:24px; display:none; gap:12px; grid-template-columns:1fr 1fr;
  box-shadow:0 6px 20px -14px rgba(0,0,0,0.25);
}
form.event-form.open{display:grid;}
form.event-form label{font-size:0.78rem;color:var(--muted);display:block;margin-bottom:4px;font-weight:500;}
form.event-form input, form.event-form select, form.event-form textarea{
  width:100%; border:1px solid var(--line); background:var(--paper); color:var(--ink);
  border-radius:7px; padding:9px 10px; font-size:0.9rem; font-family:inherit;
}
form.event-form input:focus, form.event-form select:focus, form.event-form textarea:focus{
  outline:2px solid var(--accent2); outline-offset:1px;
}
form.event-form .full{grid-column:1/-1;}
form.event-form .actions{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end;margin-top:4px;}

.section-label{
  font-family:'Poppins',sans-serif;font-size:0.95rem;font-weight:600;color:var(--ink);
  margin:26px 0 10px;display:flex;align-items:center;gap:8px;
}
.section-label::after{content:'';flex:1;height:1px;background:var(--line);}
.empty{color:var(--muted);font-size:0.88rem;border:1px dashed var(--line);border-radius:var(--radius);padding:20px;text-align:center;background:var(--card);}

.card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px;
  display:flex; justify-content:space-between; gap:12px; align-items:flex-start;
  margin-bottom:10px; box-shadow:0 4px 14px -10px rgba(0,0,0,0.2);
  transition:box-shadow 0.15s ease;
}
.card:hover{box-shadow:0 8px 22px -12px rgba(0,0,0,0.28);}
.card.past{opacity:0.6;}
.card .title{font-weight:600;font-size:1rem;margin:0 0 4px;}
.card .meta{font-size:0.82rem;color:var(--muted);margin:0 0 6px;}
.card .desc{font-size:0.85rem;margin:0;}
.tag{
  display:inline-block; font-size:0.72rem; padding:3px 9px; border-radius:99px;
  background:var(--accent-soft); color:var(--accent); font-weight:600; margin-right:8px;
}
.card-actions{display:flex;gap:6px;flex-shrink:0;}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>Event Manager</h1>
    <p class="sub">Track upcoming and past events in one place.</p>
  </div>

  <div class="toolbar">
    <input type="text" id="search" placeholder="Search events...">
    <select id="filterCat">
      <option value="">All categories</option>
      <option>Academic</option>
      <option>Workshop</option>
      <option>Cultural</option>
      <option>Sports</option>
      <option>Other</option>
    </select>
    <button class="btn" id="toggleForm">+ Add event</button>
  </div>

  <form class="event-form" id="eventForm">
    <div>
      <label>Title</label>
      <input type="text" id="f-title" required>
    </div>
    <div>
      <label>Category</label>
      <select id="f-cat">
        <option>Academic</option><option>Workshop</option><option>Cultural</option>
        <option>Sports</option><option>Other</option>
      </select>
    </div>
    <div>
      <label>Date</label>
      <input type="date" id="f-date" required>
    </div>
    <div>
      <label>Time</label>
      <input type="time" id="f-time">
    </div>
    <div class="full">
      <label>Location</label>
      <input type="text" id="f-loc">
    </div>
    <div class="full">
      <label>Description</label>
      <textarea id="f-desc" rows="2"></textarea>
    </div>
    <div class="actions">
      <button type="button" class="btn ghost small" id="cancelForm">Cancel</button>
      <button type="submit" class="btn small" id="saveBtn">Save event</button>
    </div>
  </form>

  <div class="section-label">Upcoming</div>
  <div id="upcomingList"></div>

  <div class="section-label">Past</div>
  <div id="pastList"></div>
</div>

<script>
(function(){
  var STORE_KEY = 'events_v1';
  var events = [];
  var editingId = null;

  function load(){
    try{
      var raw = localStorage.getItem(STORE_KEY);
      events = raw ? JSON.parse(raw) : [];
    }catch(e){ events = []; }
  }
  function save(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(events)); }catch(e){}
  }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

  var form = document.getElementById('eventForm');
  var toggleBtn = document.getElementById('toggleForm');
  var cancelBtn = document.getElementById('cancelForm');

  toggleBtn.addEventListener('click', function(){
    editingId = null;
    document.getElementById('saveBtn').textContent = 'Save event';
    form.reset();
    form.classList.toggle('open');
  });
  cancelBtn.addEventListener('click', function(){
    form.classList.remove('open');
    form.reset();
    editingId = null;
  });

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var title = document.getElementById('f-title').value.trim();
    var date = document.getElementById('f-date').value;
    if(!title || !date) return;
    var data = {
      title: title,
      category: document.getElementById('f-cat').value,
      date: date,
      time: document.getElementById('f-time').value,
      location: document.getElementById('f-loc').value.trim(),
      desc: document.getElementById('f-desc').value.trim()
    };
    if(editingId){
      var idx = events.findIndex(function(ev){ return ev.id === editingId; });
      if(idx > -1) events[idx] = Object.assign({id: editingId}, data);
    } else {
      data.id = uid();
      events.push(data);
    }
    save();
    form.reset();
    form.classList.remove('open');
    editingId = null;
    render();
  });

  function editEvent(id){
    var ev = events.find(function(e){ return e.id === id; });
    if(!ev) return;
    editingId = id;
    document.getElementById('f-title').value = ev.title;
    document.getElementById('f-cat').value = ev.category;
    document.getElementById('f-date').value = ev.date;
    document.getElementById('f-time').value = ev.time || '';
    document.getElementById('f-loc').value = ev.location || '';
    document.getElementById('f-desc').value = ev.desc || '';
    document.getElementById('saveBtn').textContent = 'Update event';
    form.classList.add('open');
    form.scrollIntoView({behavior:'smooth', block:'start'});
  }

  function deleteEvent(id){
    events = events.filter(function(e){ return e.id !== id; });
    save();
    render();
  }

  function cardHtml(ev, isPast){
    var dt = ev.date + (ev.time ? ' · ' + ev.time : '');
    return '' +
      '<div class="card' + (isPast ? ' past' : '') + '">' +
        '<div>' +
          '<p class="title">' + escapeHtml(ev.title) + '</p>' +
          '<p class="meta"><span class="tag">' + escapeHtml(ev.category) + '</span>' + escapeHtml(dt) + (ev.location ? ' · ' + escapeHtml(ev.location) : '') + '</p>' +
          (ev.desc ? '<p class="desc">' + escapeHtml(ev.desc) + '</p>' : '') +
        '</div>' +
        '<div class="card-actions">' +
          '<button class="btn ghost small" data-edit="' + ev.id + '">Edit</button>' +
          '<button class="btn danger small" data-del="' + ev.id + '">Delete</button>' +
        '</div>' +
      '</div>';
  }

  function escapeHtml(s){
    return String(s || '').replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function render(){
    var q = document.getElementById('search').value.trim().toLowerCase();
    var cat = document.getElementById('filterCat').value;
    var today = new Date(); today.setHours(0,0,0,0);

    var filtered = events.filter(function(ev){
      if(q && ev.title.toLowerCase().indexOf(q) === -1) return false;
      if(cat && ev.category !== cat) return false;
      return true;
    });
    filtered.sort(function(a,b){ return a.date.localeCompare(b.date); });

    var upcoming = filtered.filter(function(ev){ return new Date(ev.date) >= today; });
    var past = filtered.filter(function(ev){ return new Date(ev.date) < today; }).reverse();

    var upEl = document.getElementById('upcomingList');
    var pastEl = document.getElementById('pastList');
    upEl.innerHTML = upcoming.length ? upcoming.map(function(e){ return cardHtml(e,false); }).join('') : '<div class="empty">No upcoming events. Add one to get started.</div>';
    pastEl.innerHTML = past.length ? past.map(function(e){ return cardHtml(e,true); }).join('') : '<div class="empty">No past events yet.</div>';

    document.querySelectorAll('[data-edit]').forEach(function(btn){
      btn.addEventListener('click', function(){ editEvent(btn.getAttribute('data-edit')); });
    });
    document.querySelectorAll('[data-del]').forEach(function(btn){
      btn.addEventListener('click', function(){ deleteEvent(btn.getAttribute('data-del')); });
    });
  }

  document.getElementById('search').addEventListener('input', render);
  document.getElementById('filterCat').addEventListener('change', render);

  load();
  render();
})();
</script>
</body>
</html>
